name: Verified Pages deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
# Enable only after Settings > Pages > Source is set to GitHub Actions.
# Until then the existing branch-based publisher remains active.
permissions:
  contents: read
concurrency:
  group: verified-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ACTIONS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - run: git diff --exit-code
      - run: node scripts/check-security.mjs
      - run: node --test tests/*.test.mjs
      - run: node scripts/stage-site.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
          # .well-known/ (apple-app-site-association, security.txt) starts with
          # a dot; v5 leaves such folders out unless this is on.
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
