name: Verified Pages deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
# Enable only after Settings > Pages > Source is set to GitHub Actions.
# Until then the existing branch-based publisher remains active.
permissions:
  contents: read
concurrency:
  group: verified-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ACTIONS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - run: git diff --exit-code
      - run: node scripts/check-security.mjs
      - run: node --test tests/*.test.mjs
      - run: node scripts/stage-site.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
